[project]
name = "whitedog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Qiming Xu", email = "33349132+xqm32@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiolimiter>=1.3.0",
    "anyio>=4.15.1",
    "asyncer>=0.0.18",
    "httpx2>=2.13.1",
    "loguru>=0.7.3",
    "rich>=15.0.0",
    "stamina>=26.1.0",
    "torch>=2.14.1",
    "wtpsplit>=2.2.2",
]

[project.scripts]
whitedog = "whitedog:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
